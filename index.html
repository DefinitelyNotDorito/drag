<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://site-assets.fontawesome.com/releases/v7.0.0/css/all.css">
    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/drag.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DND: Drag</title>
</head>
<body>
    <header class="df spb-c header">
        <div class="logo-cont">
            <h1 class="logo dfc">Drag</h1>
        </div>
        <div class="header-button-cont">
            <button class="theme-toggle round-btn">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </header>
    <main>
        <section class="drag-container">
            <button class="drag-toolbox-toggle round-btn active">
                <i class="fas fa-arrow-left"></i>
            </button>
            <div class="drag-toolbox">
                <div class="toolbox-top df spb-c">
                    <span>Toolbox</span>
                    <select id="category-select" name="category">
                        <option value="All">Categories</option>
                        <option value="note">Notes</option>
                        <option value="timer">Timers</option>
                        <option value="special">Special</option>
                    </select>
                </div>
                <div class="toolbox-item-cont">
                    <div class="toolbox-item note yellow dfc" data-note-type="text">
                        <h3>Add Note</h3><span>(text)</span>
                    </div>
                    <div class="toolbox-item note yellow dfc" data-note-type="table">
                        <h3>Add Note</h3><span>(table)</span>
                    </div>
                    <div class="toolbox-item note yellow dfc" data-note-type="list">
                        <h3>Add Note</h3><span>(list)</span>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="scripts/dragkit.js" type="module"></script>
</body>
</html>
